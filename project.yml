name: Stupid Underdog Pick
options:
  bundleIdPrefix: com.stupidunderdogpick
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/AppConfig.xcconfig
  Release: Config/AppConfig.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift
    from: 2.0.0
targets:
  Stupid Underdog Pick:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes:
          - "StupidUnderdogPick.entitlements"
    dependencies:
      - package: Supabase
    settings:
      base:
        PRODUCT_NAME: Stupid Underdog Pick
        PRODUCT_BUNDLE_IDENTIFIER: com.stupidunderdogpick.app
        SWIFT_VERSION: 5.9
        CODE_SIGN_ENTITLEMENTS: Sources/StupidUnderdogPick.entitlements
        ALWAYS_SEARCH_USER_PATHS: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Stupid Underdog Pick
        CFBundleShortVersionString: "1.0.5"
        CFBundleVersion: "5"
        CFBundleIconName: AppIcon
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchColor
        UIAppFonts:
          - BebasNeue-Regular.ttf
          - Barlow-Regular.ttf
          - Barlow-Medium.ttf
          - Barlow-SemiBold.ttf
          - Barlow-Bold.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-SemiBold.ttf
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        URL_SCHEME: $(URL_SCHEME)
        URL_HOST: $(URL_HOST)
        CFBundleURLTypes:
          - CFBundleURLName: com.stupidunderdogpick.auth
            CFBundleURLSchemes:
              - $(URL_SCHEME)
  Stupid Underdog PickTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Stupid Underdog Pick
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  - name: Stupid Underdog Pick
    build:
      targets:
        Stupid Underdog Pick: [run]
        Stupid Underdog PickTests: [test]

